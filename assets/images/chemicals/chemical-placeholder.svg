<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <rect width="400" height="300" fill="#F4F7FA"/>
  <rect x="1" y="1" width="398" height="298" rx="8" stroke="#D5DFEB" stroke-width="2"/>
  
  <!-- Subtle laboratory grid background pattern -->
  <g opacity="0.12" stroke="#0754B5" stroke-width="1">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
  </g>

  <!-- Central Scientific Flask Icon -->
  <g transform="translate(160, 65)">
    <!-- Flask Outline -->
    <path d="M28 8 V32 L6 68 C4 72 7 76 12 76 H68 C73 76 76 72 74 68 L52 32 V8" stroke="#0754B5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Flask Lip -->
    <path d="M22 8 H58" stroke="#0754B5" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Chemical Liquid Level -->
    <path d="M14 62 L22 50 C26 48 30 52 34 50 C38 48 42 52 46 50 C50 48 54 52 58 50 L66 62 C68 66 65 72 60 72 H20 C15 72 12 66 14 62 Z" fill="#E6F0FA" stroke="#087F38" stroke-width="2"/>
    <!-- Formulation Bubbles -->
    <circle cx="34" cy="62" r="3" fill="#087F38" opacity="0.7"/>
    <circle cx="46" cy="58" r="2" fill="#0754B5" opacity="0.6"/>
    <circle cx="40" cy="40" r="2.5" fill="#0754B5" opacity="0.4"/>
  </g>

  <!-- Text Label -->
  <text x="200" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#202B36" letter-spacing="0.02em">
    Chemical Formulation
  </text>
  <text x="200" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">
    Om Sai Enterprise &bull; Technical Sourcing
  </text>
  <text x="200" y="245" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#0754B5">
    TDS &amp; SDS Available on Direct Enquiry
  </text>
</svg>
